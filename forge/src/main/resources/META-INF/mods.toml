modLoader = "javafml" #mandatory
loaderVersion = "[${loader_version},)" #mandatory
license = "${mod_license}" # Review your options at https://choosealicense.com/.
clientSideOnly = true
issueTrackerURL = "https://github.com/kairoz9/vistrel/issues" #optional

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
logoFile = "${mod_id}.png" #optional
displayURL = "https://github.com/kairoz9/vistrel" #optional
credits = "${mod_credits}" #optional
authors = "${mod_author}" #optional
description = '''${mod_description}''' #mandatory

[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.forge.mixins.json"

[[dependencies.${mod_id}]] #mandatory
modId = "forge"
mandatory = true
versionRange = "[${api_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

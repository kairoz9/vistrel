[package]
name = "vistrel"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/kairoz9/vistrel"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
all = "deny"

[dependencies]
async-trait = "0.1.92"
arc-swap = "1.9"
bytes = "1.12.1"
bzip2 = "0.6"
jni = "0.22"
libc = "0.2"
libloading = "0.9"
openh264 = { version = "0.9.10", default-features = false, features = ["libloading"] }
# 版本需与 openh264 解析到的 0.9.x 保持一致。
openh264-sys2 = { version = "0.9", default-features = false, features = ["libloading"] }
opus = "0.4.0"
parking_lot = "0.13"
rtc = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
webrtc = "0.21.1"
# ash 必须钉在这个 git rev 上：crates.io 的 0.38.0 只带 Vulkan 1.3.281 头文件，
# 缺 VK_KHR_video_encode_av1 / VK_KHR_video_encode_intra_refresh / API_VERSION_1_4。
ash = { git = "https://github.com/ash-rs/ash", rev = "f4c2ca3e4f6b998d5254ad101a32f024d87cdec2" }
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "dynamic-loading",
    "cuda-12040",
] }

[dev-dependencies]
yuv = "0.8"
tokio = { version = "1.54.1", features = ["test-util"] }
proptest = "1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release.package."*"]
opt-level = 3

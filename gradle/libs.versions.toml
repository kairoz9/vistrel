# 全局依赖与插件版本唯一源

[versions]
junit = "6.1.3"
# sponge-mixin 升级需确认 NeoForge 和 Fabric各自捆绑的版本是否兼容：
# https://github.com/neoforged/NeoForge/blob/26.3.x/gradle.properties#L37
# https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
sponge-mixin = "0.17.4+mixin.0.8.7"
fabric-loader = "0.19.5"
mixin-ap = "0.8.5"
mixinextras = "0.5.3"
asm = "9.7.1"
gson = "2.10"
guava = "31.1-jre"

# fabric-loom 版本同时钉住控制脚本 apply false 的双变体声明；loom-back-compat 据此按版本矩阵挑变体
fabric-loom = "1.18.1"
neoforged-moddev = "2.0.147"
forge-gradle = "[7.0.17,8)"
forge-jarjar = "0.2.3"
forge-renamer = "1.0.17"
spotless = "8.10.4"
stonecutter = "0.9.8"
foojay-resolver = "1.0.0"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
sponge-mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "sponge-mixin" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
mixin-ap = { module = "org.spongepowered:mixin", version.ref = "mixin-ap" }
mixinextras-common = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }
mixinextras-forge = { module = "io.github.llamalad7:mixinextras-forge", version.ref = "mixinextras" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
fabric-loom-remap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "fabric-loom" }
neoforged-moddev = { id = "net.neoforged.moddev", version.ref = "neoforged-moddev" }
forge-gradle = { id = "net.minecraftforge.gradle", version.ref = "forge-gradle" }
forge-jarjar = { id = "net.minecraftforge.jarjar", version.ref = "forge-jarjar" }
forge-renamer = { id = "net.minecraftforge.renamer", version.ref = "forge-renamer" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
stonecutter = { id = "dev.kikugie.stonecutter", version.ref = "stonecutter" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }

# JDK 24+ 对 sun.misc.Unsafe 内存访问方法打印终端弃用告警，调用方是构建工具链加载的
# joml/lwjgl；该参数 JDK 23 及更早不识别
org.gradle.jvmargs=-Xmx4G --sun-misc-unsafe-memory-access=allow

# Stonecutter 靠原地改写条件注释切换版本，项目并行会与翻转竞争（实测多版本编译随机失败），故不开 parallel
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
dev.kikugie.stonecutter.hard_mode=true

version=0.1.0
group=com.kairo.vistrel
description=WebRTC Pixel Streaming for Minecraft

mod.id=vistrel
mod.name=Vistrel

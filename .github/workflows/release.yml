name: Release

on:
  # 推 tag 默认只构建、不发布：真实发布需先置仓库变量 RELEASE_PUBLISH_ENABLED=true。
  # 这样「推 tag 验证产物」与「正式发版」是同一入口，靠变量区分，无需临时取消运行。
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（v 前缀；留空时取当前 ref）
        type: string
        required: false
      dry_run:
        description: 只构建并生成 SHA256SUMS，不创建 Release、不上传 CurseForge
        type: boolean
        required: false
        default: false

# tag 推送与手动重跑同 ref 只保留最新一次运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Verify Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Resolve publish gate
        id: gate
        # 发布需同时满足：非 dry_run 且仓库变量 RELEASE_PUBLISH_ENABLED 为 true。
        # 推 tag 走 push 事件，inputs.dry_run 为空（≠ true），故真实发布由变量唯一决定；
        # 手动 dispatch 时 dry_run=true 直接压过变量，两条路径语义一致。
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ENABLED: ${{ vars.RELEASE_PUBLISH_ENABLED }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dry_run=true，只构建不发布"
          elif [ "$ENABLED" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_PUBLISH_ENABLED 未设为 true，只构建不发布"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::发布已启用，将创建 Release 并同步到已配置的平台（CurseForge / Modrinth / BBSMC）"
          fi

      - name: Resolve and validate tag
        id: tag
        # tag 经环境变量传入而非直接内插，杜绝 workflow_dispatch 输入的脚本注入
        env:
          TAG_INPUT: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG_INPUT"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag 必须形如 v<major>.<minor>.<patch>，当前为 '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify version consistency across the three sources
        # 版本三事实源必须与 tag 一致：gradle.properties（mod）/ Cargo.toml（rust）/ package.json（web），
        # 仓库无自动同步机制，发布前在此统一兜底
        run: |
          version="${{ steps.tag.outputs.version }}"
          grep -qx "version=$version" gradle.properties \
            || { echo "::error::gradle.properties 缺少 'version=$version'"; exit 1; }
          grep -qx "version = \"$version\"" rust-native/Cargo.toml \
            || { echo "::error::rust-native/Cargo.toml 缺少 'version = \"$version\"'"; exit 1; }
          grep -q "\"version\": \"$version\"" web/package.json \
            || { echo "::error::web/package.json 版本 ≠ $version"; exit 1; }

      - name: Extract release body from tag message
        # annotated tag 的 annotation 即 Release 正文与 CurseForge changelog；
        # 轻量 tag 没有 annotation，回退到默认正文
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          version="${tag#v}"
          if [ "$(git for-each-ref "refs/tags/$tag" --format='%(objecttype)')" = "tag" ]; then
            git for-each-ref "refs/tags/$tag" --format='%(contents)' | sed -e 's/[[:space:]]*$//' > release-body.md
          else
            cat > release-body.md <<EOF
          ## Vistrel ${version}

          Source code, issue tracker and full documentation: [github.com/kairoz9/vistrel](https://github.com/kairoz9/vistrel)

          NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.
          EOF
          fi

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-meta
          path: release-body.md
          if-no-files-found: error

  build:
    name: Build Release Jars
    needs: guard
    # 同仓可复用工作流：检出即 26.3 基准视图，natives/web 经 artifact 落到 gradle 默认路径
    uses: ./.github/workflows/build.yml
    with:
      upload_jars: true

  release:
    name: Create GitHub Release
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v8
        with:
          name: release-meta
          path: meta

      - name: Download distributable jars
        uses: actions/download-artifact@v8
        with:
          name: distributable-jars
          path: dist

      - name: Generate and verify SHA256SUMS
        # 校验和文件内只含文件名（扁平），玩家下载后可直接 sha256sum -c SHA256SUMS
        run: |
          cd dist
          sha256sum *.jar > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        if: needs.guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          body_path: meta/release-body.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  # 三个平台各自一个可复用工作流，互不连累：任一平台失败不会影响其它平台，
  # 也便于单独重跑。凭据缺失时整组跳过。
  publish-cf:
    name: CurseForge
    needs: [guard, build]
    if: vars.CURSEFORGE_PROJECT_ID != '' && needs.guard.outputs.publish == 'true'
    uses: ./.github/workflows/publish-curseforge.yml
    secrets: inherit
    with:
      version: ${{ needs.guard.outputs.version }}

  publish-modrinth:
    name: Modrinth
    needs: [guard, build]
    if: vars.MODRINTH_PROJECT_ID != '' && needs.guard.outputs.publish == 'true'
    uses: ./.github/workflows/publish-modrinth.yml
    secrets: inherit
    with:
      version: ${{ needs.guard.outputs.version }}

  publish-bbsmc:
    name: BBSMC
    needs: [guard, build]
    if: vars.BBSMC_PROJECT_ID != '' && needs.guard.outputs.publish == 'true'
    uses: ./.github/workflows/publish-bbsmc.yml
    secrets: inherit
    with:
      version: ${{ needs.guard.outputs.version }}

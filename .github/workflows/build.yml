name: Build & Release Matrix

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - "rust-native/about.toml"
      - "rust-native/about.hbs"
      - "rust-native/tools/**"
      - "rust-native/scripts/**"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - "rust-native/about.toml"
      - "rust-native/about.hbs"
      - "rust-native/tools/**"
      - "rust-native/scripts/**"
  workflow_dispatch:

# 同分支连续推送（amend 强推 / 连续提交）只保留最新一次运行，旧运行自动取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-native-linux:
    name: Build & Lint Native (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: rust-native

      - name: Lint
        run: cargo clippy --all-targets --target x86_64-unknown-linux-gnu -- -D clippy::all
        working-directory: rust-native

      - name: Build Linux dynamic library
        run: cargo build --release --target x86_64-unknown-linux-gnu
        working-directory: rust-native

      - name: Upload Linux native artifact
        uses: actions/upload-artifact@v5
        with:
          name: native-linux
          path: rust-native/target/x86_64-unknown-linux-gnu/release/libvistrel.so
          if-no-files-found: error

  build-native-windows:
    name: Build & Lint Native (Windows x86_64 MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: rust-native

      - name: Lint
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D clippy::all
        working-directory: rust-native

      - name: Build Windows dynamic library
        run: cargo build --release --target x86_64-pc-windows-msvc
        working-directory: rust-native

      - name: Upload Windows native artifact
        uses: actions/upload-artifact@v5
        with:
          name: native-windows
          path: rust-native/target/x86_64-pc-windows-msvc/release/vistrel.dll
          if-no-files-found: error

  build-web:
    name: Lint & Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Lint web
        run: pnpm run lint
        working-directory: web

      - name: Build web
        run: pnpm run build
        working-directory: web

      - name: Upload web dist
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build-jars:
    name: Assemble Multi-Loader Jars
    needs: [build-native-linux, build-native-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Download Linux native library
        uses: actions/download-artifact@v8
        with:
          name: native-linux
          path: rust-native/target/release

      - name: Download Windows native library
        uses: actions/download-artifact@v8
        with:
          name: native-windows
          path: rust-native/target/release

      - name: Download web dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all versions with check gates
        # 前端已由 build-web job 预构建，-x webAssets 避免本 job 依赖 pnpm
        run: ./gradlew buildAndCollect -x webAssets --no-daemon
